name: Passwords page

# The ED tools passwords page (passwords.html, passwords/): unit tests (with the
# repo-hygiene check), the vault rules against the Firestore emulator, and the
# page flows against the Auth and Firestore emulators in the runner's Google
# Chrome (WebKit runs on the maintainer's Mac). Changes nothing live: the
# emulators run as the demo project demo-mgh-ed-admin, which never talks to a
# real one. No schedule; free for this public repo; about 3 minutes.
on:
  push:
    branches: ['**']
    paths:
      - passwords.html
      - passwords/**
      - shared/ed-ui.css
      - index.html
      - .gitignore
      - .github/workflows/passwords.yml
  pull_request:
    paths:
      - passwords.html
      - passwords/**
      - shared/ed-ui.css
      - index.html
      - .gitignore
      - .github/workflows/passwords.yml

permissions:
  contents: read

concurrency:
  group: passwords-${{ github.ref }}
  cancel-in-progress: true

# Same conventions as hiring's tests.yml: a named runner image, GitHub-authored
# actions only, each pinned by commit hash, and a short timeout.
jobs:
  tests:
    name: Unit, rules and page flows (emulators)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: passwords/tests
    env:
      CHROME: /usr/bin/google-chrome
      FLOW_BROWSERS: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Firestore emulator is a Java program.
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: passwords/tests/package-lock.json

      # firebase-tools downloads the emulators on first use; keep them between runs.
      - name: Cache the emulator downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('passwords/tests/package-lock.json') }}

      - name: Install test tools
        run: npm ci

      - name: Check Chrome is there
        run: '"$CHROME" --version'

      - name: Unit tests (with repo hygiene)
        run: npm run test:unit

      - name: Vault rules (Firestore emulator)
        run: npm run test:rules

      - name: Page flows (Auth and Firestore emulators, Chrome)
        run: npm run test:flows
