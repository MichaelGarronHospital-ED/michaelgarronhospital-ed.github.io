<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://www.gstatic.com/firebasejs/10.12.2/; style-src 'self'; img-src 'self'; connect-src https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://www.googleapis.com; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title>ED tools passwords</title>
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <!-- Shared ED look first (unchanged master), then this page's own layout. -->
  <link rel="stylesheet" href="shared/ed-ui.css?v=2">
  <link rel="stylesheet" href="passwords/styles.css?v=2">
  <!-- First: refuse to run inside a frame, and the "didn't finish loading" net. -->
  <script src="passwords/boot.js?v=2"></script>
  <script type="module" src="passwords/app.js?v=2"></script>
</head>
<body class="ed-page">
  <!-- Leadership only. Nothing typed here is kept: the sign-in lasts while this
       tab is open, and a reload asks again. See passwords/app.js. -->
  <header id="top" class="pw-top" hidden>
    <span class="ed-badge" aria-hidden="true">ED</span>
    <h1 class="pw-h1">ED tools passwords</h1>
    <button id="logout" class="ed-btn ed-btn-plain" type="button">Log out</button>
  </header>

  <main id="main" class="pw-wrap">
    <section id="gate" class="ed-card pw-gate" aria-labelledby="gateTitle">
      <span class="ed-badge pw-gate-badge" aria-hidden="true">ED</span>
      <h1 id="gateTitle" class="pw-h1">ED tools passwords</h1>
      <p id="gateLead" class="ed-muted">Enter the Leadership password to see and change the ED tools passwords.</p>
      <p id="gerr" class="pw-msg" role="alert"></p>
      <form id="gateForm" class="pw-gate-form" autocomplete="off" novalidate>
        <label class="ed-label" for="gpw">Leadership password</label>
        <input id="gpw" class="ed-field" type="password" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
        <button id="gbtn" class="ed-btn ed-btn-filled" type="submit">Enter</button>
      </form>
    </section>
    <div id="app" hidden></div>
  </main>

  <!-- The step-by-step dialog (passwords/util.js flowDialog) -->
  <div id="flowWrap" class="pw-overlay" hidden>
    <div class="pw-sheet ed-card" role="dialog" aria-modal="true" aria-labelledby="flowTitle">
      <h2 id="flowTitle" class="pw-sheet-title" tabindex="-1"></h2>
      <!-- a form, so Return (or "go" on a phone keyboard) presses the step's main button -->
      <form id="flowForm" autocomplete="off" novalidate>
        <div id="flowBody"></div>
        <div id="flowBtns" class="pw-btns"></div>
      </form>
      <!-- never replaced: each step's title and message are read out here -->
      <p id="flowLive" class="pw-sr" role="status" aria-live="polite"></p>
    </div>
  </div>
</body>
</html>
