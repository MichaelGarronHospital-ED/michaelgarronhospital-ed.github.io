<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title>MGH ED Tools</title>
  <meta name="description" content="Web tools built for the Michael Garron Hospital Emergency Department.">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="ED Tools">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <!-- Link preview when the address is pasted into email, Teams or a chat. -->
  <meta property="og:title" content="MGH ED Tools">
  <meta property="og:description" content="Web tools for the Michael Garron Hospital Emergency Department.">
  <meta property="og:url" content="https://michaelgarronhospital-ed.github.io/">
  <meta property="og:image" content="https://michaelgarronhospital-ed.github.io/icons/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap">
    <header class="head">
      <p class="eyebrow"><span class="nowrap">Michael Garron Hospital ·</span> <span class="nowrap">Emergency Department</span></p>
      <h1>ED Tools</h1>
      <p class="lede">Choose a tool. Each one has its own <span class="nowrap">sign-in</span>.</p>
    </header>

    <!-- Tiles are generated from tools.json by app.js. To add a tool, edit tools.json only. -->
    <ul class="grid" id="tools" aria-label="Tools"></ul>

    <noscript>
      <ul class="grid">
        <li><a class="tile" href="https://michaelgarronhospital-ed.github.io/mgh-ed-motion-voting/"><span class="name">Motion Voting</span></a></li>
        <li><a class="tile" href="https://michaelgarronhospital-ed.github.io/mgh-ed-hiring/"><span class="name">Physician Hiring</span></a></li>
        <li><a class="tile" href="https://mgh-ed-patient-hub.pages.dev"><span class="name">Patient Hub</span></a></li>
      </ul>
    </noscript>

    <footer class="foot">
      <a href="https://github.com/MichaelGarronHospital-ED/michaelgarronhospital-ed.github.io">About these tools</a>
    </footer>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
